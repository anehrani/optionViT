[package]
name = "optionvit"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4.42"
polars = { version = "0.51.0", features = ["lazy", "temporal", "strings"] }
rustc-hash = "2.1.1"
